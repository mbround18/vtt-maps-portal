apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vtt-maps-site.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vtt-maps-site.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vtt-maps-site.name" . }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "vtt-maps-site.fullname" . }}-secrets
            - configMapRef:
                name: {{ include "vtt-maps-site.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
