name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}
      - run: paws ci --toolchain rust

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}
      - run: paws ci --toolchain node
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v7
      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}
      - name: Build and push runtime image (sha tag)
        run: |
          paws docker \
            --image mbround18/vtt-maps-portal \
            --dockerfile infra/docker/Dockerfile \
            --context . \
            --target runtime \
            --dockerhub-username mbround18 \
            --push
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      # --with-latest didn't actually add a :latest tag in practice (verified
      # against a real push -- only the sha-derived tag landed on Docker Hub),
      # so tag :latest explicitly rather than rely on undocumented behavior.
      # compose.yaml's image reference defaults to ${VERSION:-latest}.
      - name: Build and push runtime image (latest tag)
        run: |
          paws docker \
            --image mbround18/vtt-maps-portal \
            --version latest \
            --dockerfile infra/docker/Dockerfile \
            --context . \
            --target runtime \
            --dockerhub-username mbround18 \
            --push
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
