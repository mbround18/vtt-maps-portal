name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust fmt
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust test
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v7
      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}
          # Pin instead of tracking "latest": v0.0.1-prerelease.26 shipped
          # without an x86_64-unknown-linux-gnu asset, breaking installs on
          # this runner. .25 is confirmed working.
          version: v0.0.1-prerelease.25
      - name: Build and push runtime image (sha tag)
        run: |
          paws docker \
            --image mbround18/vtt-maps-portal \
            --dockerfile infra/docker/Dockerfile \
            --context . \
            --target runtime \
            --dockerhub-username mbround18 \
            --push
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      # --with-latest didn't actually add a :latest tag in practice (verified
      # against a real push -- only the sha-derived tag landed on Docker Hub),
      # so tag :latest explicitly rather than rely on undocumented behavior.
      # compose.yaml's image reference defaults to ${VERSION:-latest}.
      - name: Build and push runtime image (latest tag)
        run: |
          paws docker \
            --image mbround18/vtt-maps-portal \
            --version latest \
            --dockerfile infra/docker/Dockerfile \
            --context . \
            --target runtime \
            --dockerhub-username mbround18 \
            --push
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
